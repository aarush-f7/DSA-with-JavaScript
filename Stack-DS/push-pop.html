<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Push and Pop elements</title>

    <script>
            let data = [];
            let pending = data.length;
            let max = 5;

            function Insert() {
              // console.log(data);
              let welCome = document.getElementById("newEl").value
              if (pending >= max){
               alert("maxmimum length" + welCome);
              return;
              }
              data[pending] = welCome;
              pending += 1;
              document.getElementById('newEl').value="";
              console.warn("element added")
       }

      function remove(){
        if (pending >=0){
          pending -= 1;
          data.length = pending;
        }else{
          alert("stack is empty")
        }
      }

      function display(){
        for (let i=0; i<=pending-1;i++){
          console.warn(data[i])
        }
      }

    </script>

  </head>
  <body>
    <h1>
      push and pop elements in the array by creating a function and
      understanding how stack works
    </h1>
    <input type="text" placeholder="Enter Stack Element" id="newEl">
    <button onclick="Insert()">Add Element to Stack</button>
    <button onclick="remove()">Remove Element to Stack</button>
    <button onclick="display()">Display All Element of Stack</button>
  </body>
</html>
