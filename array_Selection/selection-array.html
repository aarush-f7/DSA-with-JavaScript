    <title>Selection of an array</title>

    <script>
        let array = [20, 49, 38, 25, 9, 72, 3];
        let item = 7;
        let index = undefined;

        for(let i = 0; i < array.length; i++){
            // console.log(array[i]);
            if(array[i]===item){
                index=[i];
                // break;
            }
            
        }
        
        // console.log(item);ax
        console.log(`${item} in index ${index}`);
