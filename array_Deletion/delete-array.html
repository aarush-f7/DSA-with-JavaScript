<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deletion of array</title>

    <script>

function removeEl(){
        let data = [29,46,35,7,25,49];
        let position = document.querySelector('#position').value
        position  = parseInt(position);
        //  console.warn(data);

        for (let i=position; i<data.length; i++){
            data[i]=data[i+1];
            // console.warn(data);
        }
        data.length = data.length-1;
        console.log(data);
    }
    </script>
</head>
<body>
    <input type="text" id="position" placeholder="enter position">
    <button onclick="removeEl()">Remove element</button>
    
</body>
</html>
