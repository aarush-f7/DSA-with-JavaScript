//  INDIRECT RECURSION EXAMPLE ----------------------------------

let totalApple = 10;

function buyApple(x){
    console.log("I have bought",totalApple, "apples in", x, "RS");
    if (x > 0){
        // totalApple--;
        buyMore(x);
    }else {
        console.log("I don't have suffient money");
    }
}

function buyMore(u){
    totalApple--;
    u -= 10;
    buyApple(u);
